name: Build Fonts

on:
  push:
    branches: [ main ]
    paths:
      - 'sources/Plangothic-Regular.7z'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Cache pip dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y p7zip-full fontforge python3-fontforge ttfautohint parallel
          pip install fonttools brotli fontmake

      - name: Extract TTF files
        run: |
          mkdir -p temp
          7z x sources/Plangothic-Regular.7z -obuild/

      - name: Optimize glyphs
        run: |
          mkdir -p optimized
          find build -name "Plangothic*-Regular.ttf" | parallel fontforge -script tools/optimize_glyph.py {} -s 0.5
          mv build/*_merge_glyphs.ttf optimized/

      - name: Convert to various formats
        run: |
          mkdir -p fonts/otf fonts/web fonts/static
          
          # Process each optimized TTF file
          for ttf in optimized/Plangothic*-Regular_merge_glyphs.ttf; do
            base=$(basename "$ttf" _merge_glyphs.ttf)
            echo "Processing $base..."
            
            # Create static TTF
            cp "$ttf" "fonts/static/${base}.ttf"
            
            # Convert to OTF
            fontforge -script tools/convert_font.py "$ttf" -f otf
            find . -name "${base}*_merge_glyphs.otf" -exec mv {} "fonts/otf/${base}.otf" \;
            
            # Convert to WOFF2
            fontforge -script tools/convert_font.py "$ttf" -f woff2
            find . -name "${base}*_merge_glyphs.woff2" -exec mv {} "fonts/web/${base}.woff2" \;
          done
          
          # Check if we have the expected output files
          echo "Generated files:"
          find fonts -type f | sort

      - name: Merge to TTC/OTC
        run: |
          # Function to check if all required files exist
          check_files() {
            local missing=0
            for file in "$@"; do
              if [ ! -f "$file" ]; then
                echo "ERROR: Required file $file is missing!"
                missing=1
              fi
            done
            return $missing
          }
          
          # Merge TTF to TTC
          if check_files "fonts/static/PlangothicP1-Regular.ttf" "fonts/static/PlangothicP2-Regular.ttf"; then
            python3 - <<EOF
          from fontTools.ttLib import TTFont
          from fontTools.ttLib.ttCollection import TTCollection

          font1 = TTFont("fonts/static/PlangothicP1-Regular.ttf")
          font2 = TTFont("fonts/static/PlangothicP2-Regular.ttf")

          ttc = TTCollection()
          ttc.fonts = [font1, font2]

          ttc.save("fonts/static/Plangothic.ttc")
          EOF
            echo "Successfully created TTC file"
          else
            echo "Skipping TTC creation due to missing files"
          fi
          
          # Merge OTF to OTC
          if check_files "fonts/otf/PlangothicP1-Regular.otf" "fonts/otf/PlangothicP2-Regular.otf"; then
            python3 - <<EOF
          from fontTools.ttLib import TTCollection
          from fontTools.ttLib import TTFont

          font_files = [
              "fonts/otf/PlangothicP1-Regular.otf",
              "fonts/otf/PlangothicP2-Regular.otf",
          ]

          collection = TTCollection()

          for font_file in font_files:
              font = TTFont(font_file)
              collection.fonts.append(font)

          collection.save("fonts/otf/Plangothic.ttc")
          EOF
            echo "Successfully created OTC file"
          else
            echo "Skipping OTC creation due to missing files"
          fi

      - name: Update Fonts and Amend Last Commit
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

          # 检查是否有实际变化
          git diff --quiet fonts/
          if [ $? -ne 0 ]; then
            LAST_COMMIT_MSG=$(git log -1 --pretty=%B)

            if [[ "$LAST_COMMIT_MSG" != *"[√]"* ]]; then
              git add fonts/
              git commit --amend -m "$LAST_COMMIT_MSG [√]"
              
              git push --force origin main
              echo "已更新字体并修改最近的提交"
            else
              echo "最近的提交已经包含[√]标记，跳过修改"
            fi
          else
            echo "没有字体文件变化，跳过提交"
          fi

      - name: Debug on failure
        if: failure()
        run: |
          echo "Debug information on failure:"
          echo "Directory structure:"
          find . -type f -name "*.ttf" -o -name "*.otf" -o -name "*.woff2" | sort
          echo "Last commands output:"
          tail -n 50 $GITHUB_STEP_SUMMARY || echo "No step summary available"
          echo "Environment variables:"
          env | sort